<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5b36d1">
<title>のぼれ！無限の塔</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="systems.css">
</head>
<body>
<div id="boot" class="boot"><div class="boot-logo">のぼれ！<b>無限の塔</b></div><div class="loader"><i></i></div><p>冒険の準備中...</p></div>
<div id="app" class="app hidden">
<header class="topbar">
  <div class="brand"><span class="brand-mark">♜</span><div><h1>のぼれ！無限の塔</h1><small>放置で強くなるポップRPG</small></div></div>
  <div class="resources"><button class="pill" data-action="open-stats">⚔️ <b id="powerText">0</b></button><span class="pill gold">🪙 <b id="goldText">0</b></span><span class="pill gem">💎 <b id="gemText">0</b></span><button class="icon-btn" data-action="sound">🔊</button><button class="icon-btn" data-action="settings">⚙️</button></div>
</header>
<main class="layout">
<section class="battle-card panel">
  <div class="battlefield" id="battlefield">
    <div class="sky-glow"></div><div class="float-island i1"></div><div class="float-island i2"></div>
    <div class="stage-info"><small>現在地</small><strong>第 <span id="floorText">1</span> 階</strong><em id="worldText">はじまりの草原</em></div>
    <div class="battle-actions"><button id="bossBadge" class="badge normal">雑魚</button><button id="autoBtn" class="auto on" data-action="auto">AUTO ON</button><button class="speed" data-action="speed">x1</button></div>
    <div class="quest-chip" id="questChip">🎯 10階の守護者を倒そう</div>
    <div class="hero-zone"><div id="heroSprite" class="hero-sprite sprite hero-0"></div><div class="nameplate"><b id="heroName">アレン</b><span>Lv.<i id="levelText">1</i></span></div><div class="hero-hp"><i id="heroHpBar"></i></div></div>
    <div class="enemy-zone"><div id="enemySprite" class="enemy-sprite sprite enemy-sheet-1 enemy-0"></div><div class="enemy-shadow"></div><div class="enemy-name"><b id="enemyName">ぷるぷるスライム</b><span id="enemyType">雑魚</span></div><div class="enemy-hp"><i id="enemyHpBar"></i><span id="enemyHpText">0 / 0</span></div></div>
    <div id="damageLayer" class="damage-layer"></div>
    <button id="attackBtn" class="attack-btn" data-action="attack"><span>⚔️</span><b>攻撃</b><small>クリック</small></button>
    <div class="skill-row"><button data-skill="burst"><span>🔥</span><i id="skillBurst">READY</i></button><button data-skill="heal"><span>💚</span><i id="skillHeal">READY</i></button><button data-skill="gold"><span>🪙</span><i id="skillGold">READY</i></button></div>
    <div class="battle-log" id="battleLog">冒険が始まった！</div>
  </div>
  
</section>
<aside class="side-column">
<section class="progress-card panel"><div class="level-line"><b>Lv.<span id="levelSide">1</span> 冒険者</b><span>戦力 <i id="powerSide">0</i></span></div><div class="xp-bar"><i id="xpBar"></i></div><div class="xp-line"><span>経験値</span><b id="xpText">0 / 100</b></div><div class="stats-mini"><div>⚔️<small>攻撃</small><b id="atkText">0</b></div><div>❤️<small>HP</small><b id="hpText">0</b></div><div>🍀<small>ドロップ</small><b id="dropText">0%</b></div><div>⏱️<small>DPS</small><b id="dpsText">0</b></div></div></section>
<section class="content-card panel"><div id="tabContent"></div></section>
<section class="quick-row"><button data-exp="menu">🗺️ 冒険</button><button data-action="offline">⏰ 放置報酬</button><button data-action="missions">📜 ミッション</button><button data-action="encyclopedia">📖 図鑑</button></section>
</aside>
</main>
<nav class="mobile-utility" id="mobileUtility"><button data-exp="menu"><span>🗺️</span>冒険</button><button data-action="encyclopedia"><span>📖</span>図鑑</button><button data-action="missions"><span>📜</span>依頼</button><button data-action="achievement"><span>🏆</span>実績</button><button data-action="pet"><span>🐾</span>仲間</button></nav>
<nav class="main-tabs" id="mainTabs">
    <button class="active" data-tab="level"><span>⬆️</span>レベルアップ</button><button data-tab="equipment"><span>🛡️</span>装備</button><button data-tab="items"><span>🎒</span>アイテム</button><button data-tab="gacha"><span>🔮</span>ガチャ</button><button data-tab="shop"><span>🏪</span>ショップ</button>
  </nav>
<footer class="footer-features"><button data-action="achievement">🏆<b>実績</b><small id="achievementCount">0/30</small></button><button data-action="daily">🎁<b>デイリー</b><small id="dailyState">受取可能</small></button><button data-action="pet">🐾<b>仲間</b><small>3種類</small></button><button data-action="rebirth">👑<b>転生</b><small id="rebirthState">100階で解放</small></button></footer>
</div>
<div id="modal" class="modal hidden"><div class="modal-backdrop" data-action="close-modal"></div><div class="modal-card"><button class="modal-close" data-action="close-modal">×</button><div id="modalContent"></div></div></div>
<div id="toastArea" class="toast-area"></div>
<script src="data.js"></script><script src="systems.js"></script><script src="game.js"></script>
</body></html>
